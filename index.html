<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three shops</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #0d0b0a; --fg: #efe8dc; --muted: #a59d94; color-scheme: dark; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, serif; display: grid; place-items: center; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
a { display: block; color: inherit; text-decoration: none; font-size: clamp(34px, 9vw, 64px); font-style: italic; line-height: 1.1; padding: 6px 0; }
a span { display: block; font-style: normal; font-size: 16px; color: var(--muted); }
a:focus-visible { outline: 1px solid var(--fg); outline-offset: 6px; }
</style>
</head>
<body>
<ul>
  <li><a href="barber/">Candil<span>Barbers, Steinway Street</span></a></li>
  <li><a href="cafe/">Harina Clara<span>Panadería y café, 30th Avenue</span></a></li>
  <li><a href="restaurant/">Desvelo<span>Restaurante y bar, Ditmars</span></a></li>
</ul>
</body>
</html>
